<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant todo list application with local storage">
    <title>TaskMaster - Todo List App</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-check-circle"></i>
                    <h1>Task<span>Master</span></h1>
                </div>
                <p class="tagline">Organize your day, achieve your goals</p>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <i class="fas fa-list"></i>
                <div class="stat-info">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div class="stat-info">
                    <span class="stat-number" id="activeTasks">0</span>
                    <span class="stat-label">Active</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-double"></i>
                <div class="stat-info">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="add-task-container">
            <form id="taskForm" class="task-form">
                <div class="input-wrapper">
                    <i class="fas fa-plus-circle"></i>
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="What do you need to do today?"
                        autocomplete="off"
                        required
                    >
                </div>
                <button type="submit" class="btn-add">
                    <i class="fas fa-paper-plane"></i>
                    <span>Add Task</span>
                </button>
            </form>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-list"></i> All
            </button>
            <button class="filter-btn" data-filter="active">
                <i class="fas fa-clock"></i> Active
            </button>
            <button class="filter-btn" data-filter="completed">
                <i class="fas fa-check"></i> Completed
            </button>
        </div>

        <!-- Task List -->
        <div class="tasks-container">
            <ul id="taskList" class="task-list">
                <!-- Tasks will be added here dynamically -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks yet!</h3>
                <p>Add your first task to get started</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn-action" id="clearCompleted">
                <i class="fas fa-trash-alt"></i>
                Clear Completed
            </button>
            <button class="btn-action btn-danger" id="clearAll">
                <i class="fas fa-eraser"></i>
                Clear All
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Task added successfully!</span>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input 
                    type="text" 
                    id="editInput" 
                    placeholder="Update your task..."
                >
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelEdit">Cancel</button>
                <button class="btn-save" id="saveEdit">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Made with <i class="fas fa-heart"></i> by <a href="https://rajatsharma0087.github.io/-personal-portfolio/" target="_blank">Rajat Sharma</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
